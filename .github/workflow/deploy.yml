# .github/workflows/deploy.yml
# GitHub Actions workflow to deploy SHESHA & JOBELA DIGITAL to GitHub Pages

name: Deploy SHESHA & JOBELA DIGITAL

on:
  # Trigger on push to main branch
  push:
    branches: [ main ]
  
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

# Sets permissions for the GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Step 4: Build the project
      - name: Build Ionic/Angular project
        run: npm run build -- --configuration production --base-href /shesha-and-jobela/
        # Replace 'shesha-and-jobela' with your repository name

      # Step 5: Setup Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Step 6: Upload artifacts
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www
          # For Angular projects, change 'www' to 'dist'

      # Step 7: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4